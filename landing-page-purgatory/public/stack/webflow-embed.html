<!--
  Card Stack - single-file Webflow embed.

  Paste this entire block into a Webflow Embed element (HTML Embed).
  - It carries its own <style> and <script>, so you don't have to touch
    Site Settings -> Custom Code.
  - It pulls GSAP from a public CDN.
  - Edit the .card-stack-demo width/height and the four <img> URLs to taste.

  Tune behavior via data-* attributes on the [data-stack] wrapper:
    data-stack-random-rotation   "true" | "false"   default false
    data-stack-sensitivity       number             default 200 (drag px to send-to-back)
    data-stack-send-to-back-on-click "true" | "false" default false
    data-stack-autoplay          "true" | "false"   default false
    data-stack-autoplay-delay    number ms          default 3000
    data-stack-pause-on-hover    "true" | "false"   default false
    data-stack-overshoot         number             default 1.4 (spring snap)
-->

<style>
  [data-stack] {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 600px;
  }
  [data-stack-card] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 1rem;
    overflow: hidden;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    will-change: transform;
  }
  [data-stack-card].cs-grabbing { cursor: grabbing; }
  [data-stack-card] img,
  [data-stack-card] video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .card-stack-demo {
    width: 280px;
    height: 280px;
  }
</style>

<div
  class="card-stack-demo"
  data-stack
  data-stack-random-rotation="true"
  data-stack-sensitivity="180"
  data-stack-send-to-back-on-click="true"
>
  <div data-stack-card>
    <img src="https://images.unsplash.com/photo-1480074568708-e7b720bb3f09?q=80&w=500&auto=format" alt="card-1">
  </div>
  <div data-stack-card>
    <img src="https://images.unsplash.com/photo-1449844908441-8829872d2607?q=80&w=500&auto=format" alt="card-2">
  </div>
  <div data-stack-card>
    <img src="https://images.unsplash.com/photo-1452626212852-811d58933cae?q=80&w=500&auto=format" alt="card-3">
  </div>
  <div data-stack-card>
    <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c?q=80&w=500&auto=format" alt="card-4">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* Card Stack runtime - same logic as stack.js, inlined for one-paste use. */
(function () {
  'use strict';
  function clampMap(v, a, b, c, d) {
    var t = Math.max(a, Math.min(b, v));
    return c + ((t - a) / (b - a)) * (d - c);
  }
  function readOpts(el) {
    var d = el.dataset;
    return {
      randomRotation: d.stackRandomRotation === 'true',
      sensitivity: Number(d.stackSensitivity) || 200,
      sendToBackOnClick: d.stackSendToBackOnClick === 'true',
      autoplay: d.stackAutoplay === 'true',
      autoplayDelay: Number(d.stackAutoplayDelay) || 3000,
      pauseOnHover: d.stackPauseOnHover === 'true',
      springOvershoot: Number(d.stackOvershoot) || 1.4
    };
  }
  function CardStack(el, opts, gsap) {
    this.el = el; this.opts = opts; this.gsap = gsap;
    this.cards = Array.prototype.slice.call(el.querySelectorAll('[data-stack-card]'));
    this.order = this.cards.slice();
    this.paused = false; this.autoplayTimer = null;
    var self = this;
    this.cards.forEach(function (c) {
      c._randomRot = opts.randomRotation ? Math.random() * 10 - 5 : 0;
      gsap.set(c, { transformOrigin: '90% 90%' });
      self.attach(c);
    });
    this.layout(true);
    if (opts.autoplay) this.startAuto();
    if (opts.pauseOnHover) {
      el.addEventListener('mouseenter', function () { self.paused = true; });
      el.addEventListener('mouseleave', function () { self.paused = false; });
    }
  }
  CardStack.prototype.layout = function (immediate) {
    var len = this.order.length, gsap = this.gsap;
    var ease = 'back.out(' + this.opts.springOvershoot + ')';
    this.order.forEach(function (card, i) {
      var fromTop = len - i - 1;
      gsap.to(card, {
        rotateZ: fromTop * 4 + (card._randomRot || 0),
        scale: 1 + i * 0.06 - len * 0.06,
        zIndex: i,
        duration: immediate ? 0 : 0.55,
        ease: ease,
        overwrite: 'auto'
      });
    });
  };
  CardStack.prototype.top = function () { return this.order[this.order.length - 1]; };
  CardStack.prototype.sendToBack = function (card) {
    var idx = this.order.indexOf(card); if (idx === -1) return;
    this.order.splice(idx, 1); this.order.unshift(card);
    if (this.opts.randomRotation) card._randomRot = Math.random() * 10 - 5;
    this.layout(false);
  };
  CardStack.prototype.attach = function (card) {
    var self = this, gsap = this.gsap;
    var dragging = false, sx = 0, sy = 0, pid = null, moved = false;
    card.addEventListener('pointerdown', function (e) {
      if (self.top() !== card) return;
      dragging = true; moved = false; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
      card.classList.add('cs-grabbing');
      try { card.setPointerCapture(e.pointerId); } catch (_) {}
    });
    card.addEventListener('pointermove', function (e) {
      if (!dragging || e.pointerId !== pid) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      var ex = dx * 0.6, ey = dy * 0.6;
      gsap.set(card, {
        x: ex, y: ey,
        rotateX: clampMap(ey, -100, 100, 60, -60),
        rotateY: clampMap(ex, -100, 100, -60, 60)
      });
    });
    function release(e) {
      if (!dragging) return;
      dragging = false; card.classList.remove('cs-grabbing');
      try { card.releasePointerCapture(pid); } catch (_) {}
      var dx = e.clientX - sx, dy = e.clientY - sy;
      var s = self.opts.sensitivity;
      if (Math.abs(dx) > s || Math.abs(dy) > s) {
        // Reorder first, then animate position back in parallel with layout's
        // scale/rotateZ tween so the card glides straight to the back.
        self.sendToBack(card);
        gsap.to(card, { x: 0, y: 0, rotateX: 0, rotateY: 0,
          duration: 0.55,
          ease: 'back.out(' + self.opts.springOvershoot + ')',
          overwrite: 'auto' });
      } else {
        gsap.to(card, { x: 0, y: 0, rotateX: 0, rotateY: 0, duration: 0.55, ease: 'elastic.out(1, 0.5)' });
      }
    }
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', release);
    if (this.opts.sendToBackOnClick) {
      card.addEventListener('click', function () {
        if (moved) return;
        if (self.top() === card) self.sendToBack(card);
      });
    }
    card.addEventListener('dragstart', function (e) { e.preventDefault(); });
  };
  CardStack.prototype.startAuto = function () {
    var self = this;
    clearInterval(this.autoplayTimer);
    this.autoplayTimer = setInterval(function () {
      if (self.paused || self.order.length < 2) return;
      self.sendToBack(self.top());
    }, this.opts.autoplayDelay);
  };
  function boot() {
    if (!window.gsap) return setTimeout(boot, 50);
    document.querySelectorAll('[data-stack]').forEach(function (el) {
      if (el.__cardStack) return;
      el.__cardStack = new CardStack(el, readOpts(el), window.gsap);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
